<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Materiais em Estoque</title>
    <style>
        :root {
            --primary-color: #1e3a8a; /* Azul Padrão SAP/Corporativo */
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 750px;
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            font-size: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        /* Faz a descrição ocupar a linha inteira */
        .full-width {
            grid-column: span 2;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-container {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 15px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        button {
            padding: 11px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-clear {
            background-color: #f1f5f9;
            color: #64748b;
            border: 1px solid #cbd5e1;
        }

        .btn-clear:hover {
            background-color: #e2e8f0;
            color: #334155;
        }

        /* Responsividade para telas menores (Celulares) */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width, .btn-container {
                grid-column: span 1;
            }
            .btn-container {
                flex-direction: column-reverse;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cadastro de Material em Estoque</h2>
    
    <form id="formCadastroMaterial" onsubmit="salvarMaterial(event)">
        <div class="form-grid">
            
            <!-- Código do Material (SAP / SKU) -->
            <div class="form-group">
                <label for="codigoMaterial">Código do Material (SAP/SKU) *</label>
                <input type="text" id="codigoMaterial" placeholder="Ex: 1000452" required>
            </div>

            <!-- Tipo de Material -->
            <div class="form-group">
                <label for="tipoMaterial">Tipo de Material *</label>
                <select id="tipoMaterial" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="ROH">ROH - Matéria-Prima</option>
                    <option value="HALB">HALB - Semiacabado</option>
                    <option value="FERT">FERT - Produto Acabado</option>
                    <option value="HIBE">HIBE - Materiais Auxiliares</option>
                    <option value="ERSA">ERSA - Peças de Reposição</option>
                </select>
            </div>

            <!-- Descrição Curta -->
            <div class="form-group full-width">
                <label for="descricaoMaterial">Descrição do Material *</label>
                <input type="text" id="descricaoMaterial" placeholder="Ex: Chapa de Aço Inox 2mm x 1000mm" required>
            </div>

            <!-- Centro Logístico -->
            <div class="form-group">
                <label for="centro">Centro (Plant) *</label>
                <input type="text" id="centro" placeholder="Ex: 1000" maxlength="4" required>
            </div>

            <!-- Depósito -->
            <div class="form-group">
                <label for="deposito">Depósito (Storage Location) *</label>
                <input type="text" id="deposito" placeholder="Ex: 0001" maxlength="4" required>
            </div>

            <!-- Quantidade Inicial -->
            <div class="form-group">
                <label for="quantidade">Quantidade em Estoque *</label>
                <input type="number" id="quantidade" min="0" step="any" placeholder="0.00" required>
            </div>

            <!-- Unidade de Medida -->
            <div class="form-group">
                <label for="unidadeMedida">Unidade de Medida (UM) *</label>
                <select id="unidadeMedida" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="UN">UN - Unidade</option>
                    <option value="PC">PC - Peça</option>
                    <option value="KG">KG - Quilograma</option>
                    <option value="M">M - Metro</option>
                    <option value="L">L - Litro</option>
                    <option value="CX">CX - Caixa</option>
                </select>
            </div>

            <!-- Observações adicionais -->
            <div class="form-group full-width">
                <label for="observacoes">Observações / Dados de Prateleira</label>
                <textarea id="observacoes" placeholder="Ex: Prateleira A-3, Corredor Central..."></textarea>
            </div>

            <!-- Botões de Ação -->
            <div class="btn-container">
                <button type="button" class="btn-clear" onclick="limparFormulario()">Limpar</button>
                <button type="submit" class="btn-submit">Cadastrar Material</button>
            </div>

        </div>
    </form>
</div>

<script>
    function salvarMaterial(event) {
        event.preventDefault(); // Impede a página de recarregar

        // Captura os dados preenchidos no formulário
        const material = {
            codigo: document.getElementById('codigoMaterial').value,
            tipo: document.getElementById('tipoMaterial').value,
            descricao: document.getElementById('descricaoMaterial').value,
            centro: document.getElementById('centro').value,
            deposito: document.getElementById('deposito').value,
            quantidade: document.getElementById('quantidade').value,
            unidade: document.getElementById('unidadeMedida').value,
            observacoes: document.getElementById('observacoes').value
        };

        // Aqui você integraria com seu banco de dados ou API. 
        // Por enquanto, vamos apenas simular exibindo no console e um alerta.
        console.log("Material Cadastrado com Sucesso:", material);
        alert(`Sucesso!\nMaterial [${material.codigo}] - ${material.descricao} foi registrado no estoque.`);
        
        limparFormulario();
    }

    function limparFormulario() {
        document.getElementById('formCadastroMaterial').reset();
    }
</script>

</body>
</html>
