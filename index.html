<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Relatório de Materiais</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
            --sap-blue: #bfe5f2; /* Cor azulada de fundo do cabeçalho do SAP */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 30px auto;
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            font-size: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .double-width {
            grid-column: span 2;
        }

        .full-width {
            grid-column: span 4;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-container {
            grid-column: span 4;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 5px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }

        button {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-clear {
            background-color: #f1f5f9;
            color: #64748b;
            border: 1px solid #cbd5e1;
        }

        .btn-clear:hover {
            background-color: #e2e8f0;
        }

        /* Estilização da Tabela de Relatório */
        .table-container {
            margin-top: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Courier New', Courier, monospace; /* Fonte mono para lembrar o SAP */
            font-size: 13px;
        }

        th, td {
            padding: 6px 10px;
            text-align: left;
            border: 1px solid #cbd5e1;
        }

        th {
            background-color: var(--sap-blue);
            color: #000;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .prateleira-text {
            color: #1e3a8a;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .double-width, .full-width, .btn-container {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<!-- 1. FORMULÁRIO DE CADASTRO -->
<div class="container">
    <h2>Cadastro Rápido de Material</h2>
    
    <form id="formCadastro" onsubmit="registrarMaterial(event)">
        <div class="form-grid">
            
            <div class="form-group">
                <label for="codigoMaterial">Código do Material *</label>
                <input type="text" id="codigoMaterial" placeholder="Ex: 13011189" required>
            </div>

            <div class="form-group">
                <label for="tipoMaterial">Tipo de Material *</label>
                <input type="text" id="tipoMaterial" placeholder="Ex: ROH, FERT" required>
            </div>

            <div class="form-group double-width">
                <label for="descricaoMaterial">Descrição do Material *</label>
                <input type="text" id="descricaoMaterial" placeholder="Ex: RELE MULTIF 127/220VCA" required>
            </div>

            <div class="form-group">
                <label for="centro">Centro (Cen.) *</label>
                <input type="text" id="centro" placeholder="Ex: 1570" required>
            </div>

            <div class="form-group">
                <label for="deposito">Depósito (Dep.) *</label>
                <input type="text" id="deposito" placeholder="Ex: DEL2" required>
            </div>

            <div class="form-group">
                <label for="quantidade">Utilização Livre (Qtd) *</label>
                <input type="text" id="quantidade" placeholder="Ex: 10" required>
            </div>

            <div class="form-group">
                <label for="unidadeMedida">Unidade de Medida (UMB) *</label>
                <input type="text" id="unidadeMedida" placeholder="Ex: PC, UN, KG" required>
            </div>

            <div class="btn-container">
                <button type="button" class="btn-clear" onclick="limparFormulario()">Limpar</button>
                <button type="submit" class="btn-submit">Registrar Material</button>
            </div>

        </div>
    </form>
</div>

<!-- 2. RELATÓRIO DO ESTOQUE -->
<div class="container">
    <h2>Relatório de Materiais Registrados</h2>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 12%;">Material</th>
                    <th style="width: 35%;">Texto breve de material</th>
                    <th style="width: 15%; text-align: right;">Utilização livre</th>
                    <th style="width: 6%;">UMB</th>
                    <th style="width: 6%;">Cen.</th>
                    <th style="width: 6%;">Dep.</th>
                    <th style="width: 20%;">Dados de Prateleira</th>
                </tr>
            </thead>
            <tbody id="corpoRelatorio">
                <!-- Linhas inseridas pelo JavaScript aparecerão aqui -->
                <tr>
                    <td>13011189</td>
                    <td>RELE MULTIF 127/220VCA</td>
                    <td style="text-align: right;">10</td>
                    <td>PC</td>
                    <td>1570</td>
                    <td>DEL2</td>
                    <td class="prateleira-text">Cód: 13011189, Tipo: ROH, Desc: RELE MULTIF 127/220VCA, Centro: 1570, Dep: DEL2, Qtd: 10, UM: PC</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function registrarMaterial(event) {
        event.preventDefault(); // Impede o recarregamento automático

        // Captura os dados digitados
        const codigo = document.getElementById('codigoMaterial').value.trim();
        const tipo = document.getElementById('tipoMaterial').value.trim();
        const descricao = document.getElementById('descricaoMaterial').value.trim();
        const centro = document.getElementById('centro').value.trim();
        const deposito = document.getElementById('deposito').value.trim();
        const quantidade = document.getElementById('quantidade').value.trim();
        const unidade = document.getElementById('unidadeMedida').value.trim();

        // Monta a string corrida exigida para o campo "Dados de Prateleira"
        const dadosPrateleiraText = `Cód: ${codigo}, Tipo: ${tipo}, Desc: ${descricao}, Centro: ${centro}, Dep: ${deposito}, Qtd: ${quantidade}, UM: ${unidade}`;

        // Obtém a tabela do relatório
        const tbody = document.getElementById('corpoRelatorio');

        // Cria uma nova linha na tabela do relatório
        const novaLinha = document.createElement('tr');

        novaLinha.innerHTML = `
            <td>${codigo}</td>
            <td>${descricao.toUpperCase()}</td>
            <td style="text-align: right;">${quantidade}</td>
            <td>${unidade.toUpperCase()}</td>
            <td>${centro}</td>
            <td>${deposito.toUpperCase()}</td>
            <td class="prateleira-text">${dadosPrateleiraText}</td>
        `;

        // Insere a nova linha no início do relatório
        tbody.insertBefore(novaLinha, tbody.firstChild);

        // Alerta de sucesso e limpa o formulário para o próximo lançamento
        alert(`Material ${codigo} registrado e adicionado ao relatório!`);
        limparFormulario();
    }

    function limparFormulario() {
        document.getElementById('formCadastro').reset();
    }
</script>

</body>
</html>
